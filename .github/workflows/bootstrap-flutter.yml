
name: Initialize Flutter Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check existing files
        run: |
          set -euo pipefail

          test -f lib/main.dart
          test ! -e pubspec.yaml
          test ! -e android
          test ! -e web
          test ! -e test

          sha256sum lib/main.dart > /tmp/main.sha256

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter project
        run: |
          flutter create \
            --platforms=android,web \
            --project-name=shiny_demo \
            --org=dev.siwamoto \
            --no-pub \
            .

          sha256sum -c /tmp/main.sha256

          # Remove the default sample test.
          # It may reference a different app class.
          rm -f test/widget_test.dart
          rmdir test 2>/dev/null || true

          flutter pub get

          test -f pubspec.yaml
          test -f web/index.html
          test -d android

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "No files to commit."
            exit 0
          fi

          git commit -m "Initialize standard Flutter project"
          git push origin HEAD:main
